<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduPlay · Embed Playground</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --brand: #2563eb;
      --brand-soft: #dbeafe;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    /* Topbar */
    .topbar {
      display: flex; align-items: center; gap: 16px;
      height: 60px; padding: 0 22px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      flex: none;
    }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
    .brand .logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #2563eb, #7c3aed); display: grid; place-items: center; color: #fff; }
    .topbar .spacer { flex: 1; }
    .topbar a.back { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; }
    .topbar a.back:hover { color: var(--ink); }

    /* Cabeçalho */
    .head { padding: 22px 26px 6px; }
    .head h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.02em; }
    .head p { margin: 0; color: var(--muted); max-width: 80ch; }

    /* Layout editor / preview */
    .pg {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px 26px 26px;
      min-height: 0;
    }
    .pane {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 520px;
    }
    .pane-head {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 600; font-size: 14px;
    }
    .pane-head .dot { width: 9px; height: 9px; border-radius: 50%; background: #cbd5e1; }
    .pane-head .grow { flex: 1; }
    .btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { border-color: #cbd5e1; }
    .btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    .btn.primary:hover { background: #1d4ed8; }
    .btn.ghost { background: transparent; }

    /* Barra de exemplos */
    .examples {
      display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
    }
    .examples .lbl { font-size: 12px; color: var(--muted); font-weight: 600; margin-right: 2px; }
    .chip {
      border: 1px solid var(--line);
      background: var(--surface);
      color: #334155;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12.5px; font-weight: 600;
      cursor: pointer;
    }
    .chip:hover { border-color: var(--brand); color: var(--brand); }
    .chip.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }

    #editor {
      flex: 1;
      border: 0;
      resize: none;
      padding: 16px;
      font-family: "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
      font-size: 13.5px;
      line-height: 1.6;
      color: #0f172a;
      background: #0f172a08;
      outline: none;
      tab-size: 2;
    }
    #preview { flex: 1; border: 0; width: 100%; background: #fff; }
    .hint { font-size: 12px; color: var(--muted); padding: 8px 16px; border-top: 1px solid var(--line); }

    @media (max-width: 860px) {
      .pg { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">▶</span> EduPlay</div>
    <div class="spacer"></div>
    <button class="back" id="btn-lang" style="border:0;background:none;cursor:pointer;font:inherit">🌐 PT-BR</button>
    <a class="back" href="index.html" data-i18n="back">← Back to lesson</a>
  </header>

  <div class="head">
    <h1 data-i18n="h1">Embed Playground</h1>
    <p data-i18n="desc">
      Paste any HTML in the editor on the left and see the live result on the right.
      Use the <strong>examples</strong> below to test different kinds of content —
      including the <strong>3D Mascot</strong> embed.
    </p>
  </div>

  <div class="pg">
    <!-- Editor -->
    <section class="pane">
      <div class="pane-head">
        <span class="dot"></span> HTML
        <span class="grow"></span>
        <button class="btn ghost" id="btn-copy">Copy</button>
        <button class="btn primary" id="btn-run">Update ▶</button>
      </div>
      <div class="examples" id="examples">
        <span class="lbl" data-i18n="examplesLabel">Examples:</span>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
      <div class="hint" data-i18n="hint">Updates as you type. Supports scripts and iframes.</div>
    </section>

    <!-- Preview -->
    <section class="pane">
      <div class="pane-head">
        <span class="dot" style="background:#22c55e"></span> <span data-i18n="liveResult">Live result</span>
      </div>
      <iframe id="preview"
        title="Resultado"
        allow="camera; gyroscope; accelerometer; magnetometer; xr-spatial-tracking; fullscreen"
        sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-pointer-lock"></iframe>
    </section>
  </div>

  <script>
    // ----- i18n da interface -----
    const UI = {
      en: { back: '← Back to lesson', h1: 'Embed Playground',
        desc: 'Paste any HTML in the editor on the left and see the live result on the right. Use the <strong>examples</strong> below to test different kinds of content — including the <strong>3D Mascot</strong> embed.',
        examplesLabel: 'Examples:', hint: 'Updates as you type. Supports scripts and iframes.', liveResult: 'Live result',
        copy: 'Copy', copied: 'Copied!', update: 'Update ▶', langBtn: '🌐 PT-BR', docTitle: 'EduPlay · Embed Playground' },
      pt: { back: '← Voltar para a aula', h1: 'Playground de Embed',
        desc: 'Cole qualquer HTML no editor à esquerda e veja o resultado ao vivo à direita. Use os <strong>exemplos</strong> abaixo pra testar diferentes tipos de conteúdo — incluindo o embed do <strong>Mascote 3D</strong>.',
        examplesLabel: 'Exemplos:', hint: 'Atualiza sozinho enquanto você digita. Suporta scripts e iframes.', liveResult: 'Resultado ao vivo',
        copy: 'Copiar', copied: 'Copiado!', update: 'Atualizar ▶', langBtn: '🌐 EN', docTitle: 'EduPlay · Playground de Embed' }
    };

    // ----- Snippets de exemplo (nome bilíngue; html com versão PT onde há texto visível) -----
    const EXAMPLES = [
      {
        name: { en: '3D Mascot', pt: 'Mascote 3D' },
        html:
`<!-- 3D Mascot widget embed (what goes in the LMS).
     allow="camera" is required for the "View in AR" button. -->
<iframe
  src="https://matheussma.github.io/wireframe-web3d/"
  width="100%" height="460"
  style="border:0; max-width:760px; border-radius:12px;"
  loading="lazy"
  allow="camera; gyroscope; accelerometer; magnetometer; xr-spatial-tracking; fullscreen"
  allowfullscreen
  title="Interactive 3D mascot"></iframe>`
      },
      {
        name: { en: 'Video (YouTube)', pt: 'Vídeo (YouTube)' },
        html:
`<iframe
  width="100%" height="430"
  style="border:0; max-width:760px; border-radius:12px;"
  src="https://www.youtube.com/embed/aqz-KE-bpKQ"
  title="Video"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
  allowfullscreen></iframe>`
      },
      {
        name: { en: 'Map', pt: 'Mapa' },
        html:
`<iframe
  width="100%" height="430"
  style="border:0; max-width:760px; border-radius:12px;"
  src="https://www.openstreetmap.org/export/embed.html?bbox=-46.66%2C-23.57%2C-46.62%2C-23.54&layer=mapnik"
  title="Map"></iframe>`
      },
      {
        name: { en: 'Card', pt: 'Card' },
        html:
`<div style="font-family:system-ui; max-width:340px; margin:28px auto; border:1px solid #e2e8f0; border-radius:16px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.08)">
  <div style="height:120px; background:linear-gradient(135deg,#2563eb,#7c3aed)"></div>
  <div style="padding:18px">
    <h3 style="margin:0 0 6px">Interactive 3D course</h3>
    <p style="margin:0 0 14px; color:#64748b">Learn to explore and assemble 3D models hands-on.</p>
    <button style="background:#2563eb; color:#fff; border:0; padding:10px 16px; border-radius:8px; font-weight:600; cursor:pointer">Enroll</button>
  </div>
</div>`,
        htmlPt:
`<div style="font-family:system-ui; max-width:340px; margin:28px auto; border:1px solid #e2e8f0; border-radius:16px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.08)">
  <div style="height:120px; background:linear-gradient(135deg,#2563eb,#7c3aed)"></div>
  <div style="padding:18px">
    <h3 style="margin:0 0 6px">Curso 3D Interativo</h3>
    <p style="margin:0 0 14px; color:#64748b">Aprenda a explorar e montar modelos 3D na prática.</p>
    <button style="background:#2563eb; color:#fff; border:0; padding:10px 16px; border-radius:8px; font-weight:600; cursor:pointer">Matricular</button>
  </div>
</div>`
      },
      {
        name: { en: 'CSS animation', pt: 'Animação CSS' },
        html:
`<div style="display:grid; place-items:center; height:92vh; background:#0f172a">
  <div class="orb"></div>
</div>
<style>
  .orb {
    width:130px; height:130px; border-radius:28px;
    background:linear-gradient(135deg,#22d3ee,#3b82f6);
    box-shadow:0 0 50px rgba(59,130,246,.6);
    animation: dance 2.6s ease-in-out infinite;
  }
  @keyframes dance {
    0%   { transform: rotate(0)      scale(1);   border-radius:28px; }
    50%  { transform: rotate(180deg) scale(1.3); border-radius:50%; }
    100% { transform: rotate(360deg) scale(1);   border-radius:28px; }
  }
</style>`
      },
      {
        name: { en: 'Form', pt: 'Formulário' },
        html:
`<form style="font-family:system-ui; max-width:360px; margin:28px auto; display:grid; gap:12px"
      onsubmit="alert('Form submitted!'); return false">
  <h3 style="margin:0">Sign up for the course</h3>
  <input placeholder="Your name" style="padding:11px; border:1px solid #cbd5e1; border-radius:8px">
  <input type="email" placeholder="Your email" style="padding:11px; border:1px solid #cbd5e1; border-radius:8px">
  <button style="background:#16a34a; color:#fff; border:0; padding:12px; border-radius:8px; font-weight:600; cursor:pointer">Send</button>
</form>`,
        htmlPt:
`<form style="font-family:system-ui; max-width:360px; margin:28px auto; display:grid; gap:12px"
      onsubmit="alert('Formulário enviado!'); return false">
  <h3 style="margin:0">Inscreva-se no curso</h3>
  <input placeholder="Seu nome" style="padding:11px; border:1px solid #cbd5e1; border-radius:8px">
  <input type="email" placeholder="Seu e-mail" style="padding:11px; border:1px solid #cbd5e1; border-radius:8px">
  <button style="background:#16a34a; color:#fff; border:0; padding:12px; border-radius:8px; font-weight:600; cursor:pointer">Enviar</button>
</form>`
      }
    ];

    let lang = localStorage.getItem('eduplay-lang') || 'en';
    if (!UI[lang]) lang = 'en';

    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const examplesBar = document.getElementById('examples');
    let activeIndex = null;

    function render() { preview.srcdoc = editor.value; }
    function exHtml(i) { const e = EXAMPLES[i]; return (lang === 'pt' && e.htmlPt) ? e.htmlPt : e.html; }
    function loadExample(i) {
      activeIndex = i;
      editor.value = exHtml(i);
      render();
      chipEls.forEach((c, idx) => c.classList.toggle('active', idx === i));
    }

    // Cria os chips
    const chipEls = EXAMPLES.map((ex, i) => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = ex.name[lang];
      chip.addEventListener('click', () => loadExample(i));
      examplesBar.appendChild(chip);
      return chip;
    });

    let t;
    editor.addEventListener('input', () => {
      activeIndex = null;
      chipEls.forEach(c => c.classList.remove('active'));
      clearTimeout(t); t = setTimeout(render, 350);
    });

    document.getElementById('btn-run').addEventListener('click', render);
    document.getElementById('btn-copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(editor.value);
        const b = document.getElementById('btn-copy'); const old = b.textContent;
        b.textContent = UI[lang].copied;
        setTimeout(() => (b.textContent = UI[lang].copy), 1200);
      } catch (e) { /* ignore */ }
    });

    function applyLang() {
      const d = UI[lang];
      document.documentElement.lang = (lang === 'pt' ? 'pt-BR' : 'en');
      document.title = d.docTitle;
      document.querySelectorAll('[data-i18n]').forEach(el => { const v = d[el.dataset.i18n]; if (v != null) el.innerHTML = v; });
      document.getElementById('btn-copy').textContent = d.copy;
      document.getElementById('btn-run').textContent = d.update;
      document.getElementById('btn-lang').textContent = d.langBtn;
      chipEls.forEach((c, i) => c.textContent = EXAMPLES[i].name[lang]);
      if (activeIndex != null) loadExample(activeIndex); // recarrega o exemplo no novo idioma
    }
    document.getElementById('btn-lang').addEventListener('click', () => {
      lang = (lang === 'en' ? 'pt' : 'en');
      localStorage.setItem('eduplay-lang', lang);
      applyLang();
    });

    applyLang();
    loadExample(0); // começa no Mascote 3D
  </script>
</body>
</html>
